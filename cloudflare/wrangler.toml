# Worker di Cloudflare per il bot Telegram (codice in worker.js).
# Pubblicazione, dalla cartella cloudflare:  npx wrangler deploy
name = "agente-notizie-bot"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
REPO = "borsifrancesco1-ux/agente-notizie"

# Orologio dell'agente (UTC): ogni 15 minuti dalle 5:00 alle 21:45, cioè in Italia dalle 7:00
# alle 23:45 d'estate e dalle 6:00 alle 22:45 d'inverno. Cosa fare lo decide agente.py con l'ora italiana.
[triggers]
crons = ["0,15,30,45 5-21 * * *"]

# Archivio dei voti e della coda dei comandi (piano gratuito di Cloudflare)
[[kv_namespaces]]
binding = "STATO"
id = "6267b942de514146a423176fb74be2c2"
