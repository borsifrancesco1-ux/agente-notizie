# Worker di Cloudflare per il bot Telegram (codice in worker.js).
# Pubblicazione, dalla cartella cloudflare:  npx wrangler deploy
name = "agente-notizie-bot"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
REPO = "borsifrancesco1-ux/agente-notizie"

# Orologio dell'agente (UTC): ogni ora dalle 5:00 alle 21:00 (in Italia 7-23 d'estate, 6-22 d'inverno)
# più le 5:30 e le 6:30 per il buongiorno delle 7:30 (una delle due, a seconda dell'ora legale).
# Cosa fare lo decide agente.py con l'ora italiana.
[triggers]
crons = ["0 5-21 * * *", "30 5,6 * * *"]

# Archivio dei voti e della coda dei comandi (piano gratuito di Cloudflare)
[[kv_namespaces]]
binding = "STATO"
id = "6267b942de514146a423176fb74be2c2"
