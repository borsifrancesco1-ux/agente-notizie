# ============================================================
#  Configurazione dell'agente notizie
#  Si può modificare liberamente: lo script la rilegge a ogni esecuzione.
#  Le istruzioni in italiano libero vanno invece in profilo.md.
# ============================================================

ia:
  # Motori provati in ordine, una richiesta per giro (voti, reparti, raggruppamento e riassunti).
  # Se uno non risponde o ha finito la quota si passa al successivo; se falliscono tutti
  # si usa il filtro a parole chiave. Senza motori: solo parole chiave.
  #   chiave: nome della variabile nel file .env (su GitHub: nome del Secret)
  #   max_notizie (facoltativo): notizie al massimo per richiesta, per i servizi che
  #   accettano solo richieste piccole
  #   alternative (facoltativo, solo OpenRouter): modelli da usare se il primo è occupato
  motori:
    # Gli alias "-latest" seguono l'ultima versione, così un modello ritirato non blocca l'agente.
    # Piano gratuito (3/10/2026): "gemini-flash-latest" concede solo 20 richieste al giorno;
    # il "flash-lite" ne concede di più.
    - tipo: gemini
      modello: gemini-flash-lite-latest
      chiave: GEMINI_API_KEY
    # Prima riserva: OpenRouter, modelli gratuiti (":free"), 50 richieste al giorno.
    # I modelli gratuiti cambiano spesso: elenco su openrouter.ai/models?max_price=0
    - tipo: openai
      url: "https://openrouter.ai/api/v1/chat/completions"
      modello: google/gemma-4-31b-it:free
      alternative: ["nvidia/nemotron-3-super-120b-a12b:free", "google/gemma-4-26b-a4b-it:free"]
      chiave: OPENROUTER_API_KEY
    # Ultima riserva: GitHub Models. Su GitHub Actions usa il token automatico del
    # repository; accetta solo richieste piccole, da qui max_notizie.
    - tipo: openai
      url: "https://models.github.ai/inference/chat/completions"
      modello: openai/gpt-4.1-mini
      chiave: GITHUB_TOKEN
      max_notizie: 30
  # Per i testi della settimana (riepilogo PSP, proposta di profilo) si prova prima un modello più
  # accurato: bastano due richieste a settimana. Se non risponde, si usano i motori qui sopra.
  motore_settimanale: {tipo: gemini, modello: gemini-flash-latest, chiave: GEMINI_API_KEY}
  soglia_rilevanza: 7    # da 1 a 10: sotto la soglia non ricevi nulla (7 = solo notizie nuove e specifiche)
  # Soglie più basse per alcuni reparti (una notizia passa se supera quella di almeno uno dei suoi reparti)
  soglie_reparti: {Copertura: 6}
  soglia_ufficiali: 6    # comunicati e discorsi di istituzioni (BCE, Fed, Banca d'Italia...)

orari:
  fuso_orario: Europe/Rome
  apertura: "07:30"        # buongiorno con il calendario del giorno e il riepilogo della notte
  prima_notizia: "08:00"   # da qui un giro di notizie ogni ora...
  ultima_notizia: "22:00"  # ...fino a qui; poi il messaggio di chiusura e silenzio fino all'apertura
  max_riepilogo_notte: 5   # notizie al massimo nel riepilogo della notte
  # Riepilogo settimanale per il PSP sul canale, e proposta di modifica al profilo nella tua chat
  riepilogo_settimanale: {giorno: domenica, ora: "18:00"}

# Calendario del giorno nel buongiorno: eventi economici (ForexFactory: orario, consensus e dato
# precedente) e appuntamenti fissi. Le date di BCE e Fed sono verificate il 3/10/2026 sui siti
# ufficiali: aggiornale se cambiano. L'ora è quella italiana.
calendario:
  valute: [USD, EUR]        # USD = Stati Uniti; EUR = area euro e i suoi paesi (Germania, Italia...)
  impatto_minimo: Medium    # Low, Medium o High (🔴 alto, 🟠 medio)
  appuntamenti:
    - {data: "2026-10-28", ora: "19:00", descrizione: "Fed: decisione sui tassi (conferenza stampa alle 19:30)"}
    - {data: "2026-10-29", ora: "14:15", descrizione: "BCE: decisione sui tassi (conferenza stampa alle 14:45)"}
    - {data: "2026-12-02", ora: "", icona: "🎓", descrizione: "PSP: presentazione finale"}
    - {data: "2026-12-09", ora: "20:00", descrizione: "Fed: decisione sui tassi e proiezioni economiche (conferenza alle 20:30)"}
    - {data: "2026-12-17", ora: "14:15", descrizione: "BCE: decisione sui tassi e proiezioni (conferenza stampa alle 14:45)"}

notifiche:
  max_per_giro: 5        # tetto di notifiche per ogni giro
  con_suono_da: 9        # soglia di rilevanza per il suono: solo da questo voto il telefono suona
                         # (al massimo una volta per giro); sotto arriva in silenzio, ma resta nel canale
  finestra_ore: 12       # ignora le notizie pubblicate da più di queste ore
  finestra_ore_ufficiali: 72   # per le istituzioni, che pubblicano di rado e mai nel weekend
  etichetta_perche: "Perché conta per il PSP"   # riga sotto il riassunto
  etichetta_impatto: "Impatto atteso"           # riga sotto il "perché conta"
  # Le attività che l'impatto atteso può nominare (aggiornatele quando il portafoglio è definitivo)
  attivita_impatto: [Treasury, BTP, Bund, obbligazioni societarie, debito emergente, azioni USA,
                     azioni europee, azioni emergenti, dollaro, euro, valute emergenti, petrolio, oro]
  # Dato anomalo: avviso se un dato si scosta dal consensus più della soglia_sorpresa
  # dell'indicatore, oppure se si muove più di queste volte la sua variabilità abituale
  anomalia_sigma: 2.5

# Testate da ignorare sempre (il nome come appare nelle notifiche, accanto al link)
fonti_escluse: ["Criptovaluta.it", "Vietnam.vn"]

# Reparti del team WhiteRock. Ogni notizia indica in testa quelli a cui è più utile, come
# hashtag: toccandone uno su Telegram si vedono tutte le notizie di quel reparto.
# La descrizione aiuta l'IA a scegliere.
reparti:
  - nome: Macroeconomia
    descrizione: "crescita, lavoro, inflazione, banche centrali, politica fiscale, ciclo economico"
  - nome: Geopolitica
    descrizione: "conflitti, sanzioni, dazi e commercio internazionale, elezioni, energia, rischio Paese"
  - nome: Azionario
    descrizione: "borse, utili, valutazioni, settori, grandi titoli tecnologici"
  - nome: Obbligazionario
    descrizione: "tassi, curve dei rendimenti, titoli di Stato, spread, obbligazioni societarie, debito emergente"
  - nome: Copertura
    descrizione: "cambi, EUR/USD, valute emergenti, costo della copertura, forward, swap e opzioni valutarie"
  - nome: Risk management
    descrizione: "volatilità, stress di mercato, concentrazione, rating, default, regole MiFID e fiscalità"

# ------------------------------------------------------------
# Regola delle parole chiave: se contengono maiuscole il confronto
# rispetta maiuscole e minuscole ("Fed" non trova "fed up");
# se sono tutte minuscole, no ("inflazione" trova anche "Inflazione").
# ------------------------------------------------------------

# Titoli seguiti: cercati per nome, ticker e sinonimi in tutti i feed,
# più i feed dedicati (Yahoo, Seeking Alpha, Google News).
titoli:
  - nome: Eni
    icona: "🛢️"
    reparti: [Azionario, Risk management]
    ticker: ENI.MI
    ticker_usa: E          # ADR quotato a New York: serve per Seeking Alpha
    sinonimi: ["ENI", "Eni SpA", "Descalzi", "Plenitude", "Enilive"]
    perche: "La cliente del PSP lavora in Eni e ne ha le RSU, ma Eni è fuori dal portafoglio gestito: solo eventi straordinari"
    soglia: 9              # voto minimo per le notizie su questo titolo (più alto della soglia generale)

# Temi seguiti, nell'ordine della mappa del PSP.
# icona: compare davanti al titolo della notifica (titoli e temi; senza icona: 📰).
# reparti: quelli a cui il tema serve; si usano quando l'IA non risponde.
# parole_chiave: servono a mettere in ordine le notizie e come riserva se l'IA non risponde.
# ricerca_it / ricerca_en (facoltative): ricerche aggiunte su Google News in italiano / inglese.
temi:
  # 1. Tassi e politica monetaria
  - nome: BCE
    icona: "🇪🇺"
    reparti: [Macroeconomia, Obbligazionario]
    parole_chiave: ["BCE", "ECB", "Lagarde", "Eurotower", "€STR", "Euribor", "tassi BCE", "politica monetaria", "forward guidance"]
    ricerca_it: "BCE tassi"
  - nome: Fed
    icona: "🇺🇸"
    reparti: [Macroeconomia, Obbligazionario]
    parole_chiave: ["Fed", "FOMC", "Federal Reserve", "Fed chair", "presidente della Fed", "fed funds", "dot plot"]
    ricerca_en: "FOMC Fed rates"
  - nome: Curva dei rendimenti
    icona: "📈"
    reparti: [Obbligazionario]
    parole_chiave: ["curva dei rendimenti", "yield curve", "term premium", "premio a termine", "inversione della curva", "inverted curve", "steepening", "irripidimento", "Treasury", "Treasuries", "Bund", "bond yields", "rendimenti", "bond sell-off", "sell-off obbligazionario"]
    ricerca_en: "Treasury yields term premium"
  - nome: Inflazione e aspettative
    icona: "🌡️"
    reparti: [Macroeconomia, Obbligazionario]
    parole_chiave: ["inflazione", "inflation", "CPI", "HICP", "IPCA", "PCE", "core inflation", "inflazione di fondo", "breakeven", "inflation expectations", "aspettative di inflazione", "TIPS", "inflation-linked"]
    ricerca_en: "inflation expectations breakeven"
  # 2. Credito
  - nome: Obbligazioni societarie e default
    icona: "🏢"
    reparti: [Obbligazionario, Risk management]
    parole_chiave: ["corporate bond", "corporate bonds", "obbligazioni societarie", "investment grade", "high yield", "credit spread", "credit spreads", "spread creditizi", "default rate", "tasso di default", "ICE BofA"]
    ricerca_en: "investment grade credit spreads"
  - nome: Debito emergente e rischio Paese
    icona: "🌍"
    reparti: [Obbligazionario, Geopolitica]
    parole_chiave: ["emerging market debt", "emerging-market bonds", "debito emergente", "EMBI", "local currency bonds", "hard currency", "sovereign default", "default sovrano", "IMF", "FMI"]
    ricerca_en: "emerging market sovereign bonds spreads"
  - nome: Rating e merito di credito
    icona: "⭐"
    reparti: [Risk management, Obbligazionario]
    parole_chiave: ["rating", "Moody's", "Fitch", "S&P Global Ratings", "DBRS", "Scope Ratings", "downgrade", "upgrade", "outlook negativo", "outlook positivo", "sovereign rating", "rating sovrano"]
    ricerca_it: "rating Italia Moody's Fitch S&P"
    ricerca_en: "sovereign credit rating downgrade"
  # 3. Azionario
  - nome: Borse, valutazioni e utili
    icona: "📊"
    reparti: [Azionario]
    parole_chiave: ["S&P 500", "Stoxx 600", "STOXX 600", "Euro Stoxx", "MSCI Emerging", "Wall Street", "Piazza Affari", "FTSE MIB", "Ftse Mib", "P/E", "CAPE", "valutazioni", "valuations", "earnings season", "trimestrali", "stime sugli utili", "earnings estimates"]
  - nome: Concentrazione dei grandi titoli tecnologici
    icona: "💻"
    reparti: [Azionario, Risk management]
    parole_chiave: ["Magnificent Seven", "Magnifici Sette", "Magnifici 7", "big tech", "megacap", "mega-cap", "market concentration"]
    ricerca_en: "S&P 500 concentration megacap tech"
  - nome: Cina ed economie emergenti
    icona: "🇨🇳"
    reparti: [Azionario, Macroeconomia, Geopolitica]
    parole_chiave: ["Cina", "China", "economia cinese", "Chinese economy", "PBOC", "yuan", "renminbi", "mercati emergenti", "emerging markets", "emerging economies"]
    ricerca_en: "China economy stimulus"
  # 4. Cambi e copertura
  - nome: Cambi e costo della copertura
    icona: "💱"
    reparti: [Copertura]
    parole_chiave: ["EUR/USD", "euro-dollaro", "cambio euro", "euro dollar", "dollar index", "DXY", "valute emergenti", "emerging market currencies", "punti forward", "forward points", "copertura valutaria", "currency hedging", "FX hedging", "hedging costs", "cross-currency basis", "carry trade"]
    ricerca_it: ["cambio euro dollaro", "valute emergenti"]
    ricerca_en: ["currency hedging costs euro dollar", "EUR/USD dollar euro outlook", "emerging market currencies", "dollar index Fed ECB rate differential"]
  # 5. Contesto macro e geopolitico
  - nome: Crescita e lavoro
    icona: "🏭"
    reparti: [Macroeconomia]
    parole_chiave: ["PIL", "GDP", "PMI", "ISM", "payrolls", "nonfarm", "disoccupazione", "unemployment rate", "jobless claims", "recessione", "recession", "Istat", "Eurostat", "Ifo", "ZEW"]
    ricerca_it: "economia italiana PIL Istat"
    ricerca_en: "eurozone economy PMI"
  - nome: Geopolitica e commercio internazionale
    icona: "🌐"
    reparti: [Geopolitica]
    parole_chiave: ["geopolitica", "geopolitical", "guerra", "war", "conflitto", "conflict", "sanzioni", "sanctions", "dazi", "tariffs", "guerra commerciale", "trade war", "elezioni", "election", "NATO", "Ucraina", "Ukraine", "Russia", "Israele", "Israel", "Iran", "Taiwan", "Medio Oriente", "Middle East"]
    ricerca_it: "geopolitica mercati finanziari"
    ricerca_en: ["geopolitical risk markets", "tariffs trade war"]
  - nome: Energia e materie prime
    icona: "⚡"
    reparti: [Geopolitica, Macroeconomia]
    parole_chiave: ["petrolio", "oil prices", "Brent", "WTI", "OPEC", "OPEC+", "TTF", "gas naturale", "natural gas", "LNG", "GNL", "materie prime", "commodities"]
    ricerca_en: "oil prices OPEC"
  - nome: Debito pubblico e spread BTP-Bund
    icona: "🏛️"
    reparti: [Obbligazionario, Macroeconomia]
    parole_chiave: ["BTP", "spread", "debito pubblico", "public debt", "deficit", "legge di bilancio", "manovra", "Patto di stabilità", "aste BTP", "MEF", "OAT"]
    ricerca_it: "spread BTP Bund"
  # 6. Rischi, fiscalità e regolamentazione
  - nome: Rischi di mercato e volatilità
    icona: "🛡️"
    reparti: [Risk management]
    parole_chiave: ["volatilità", "volatility", "VIX", "MOVE index", "risk-off", "sell-off", "crollo", "crash", "stress", "liquidità", "liquidity", "contagio", "contagion", "margin call", "stabilità finanziaria", "financial stability", "stress test"]
    ricerca_it: "volatilità mercati rischio"
    ricerca_en: "market volatility VIX risk-off"
  - nome: Fiscalità e regole per i risparmiatori
    icona: "⚖️"
    reparti: [Risk management]
    parole_chiave: ["tassazione delle rendite", "rendite finanziarie", "capital gain", "Agenzia delle Entrate", "MiFID", "ESMA", "Consob", "adeguatezza", "appropriatezza", "PRIIPs", "Retail Investment Strategy"]
    ricerca_it: ["tassazione rendite finanziarie", "Consob MiFID risparmiatori"]

