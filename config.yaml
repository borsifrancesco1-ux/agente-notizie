  - {nome: Google News IT, url: "https://news.google.com/rss/search?q={query}+when:1d&hl=it&gl=IT&ceid=IT:it"}
  - {nome: Google News EN, url: "https://news.google.com/rss/search?q={query}+when:1d&hl=en-US&gl=US&ceid=US:en"}

# Indirizzi delle ricerche su Google News usate dai temi (ricerca_it / ricerca_en)
ricerca_google_news:
  it: "https://news.google.com/rss/search?q={query}+when:1d&hl=it&gl=IT&ceid=IT:it"
  en: "https://news.google.com/rss/search?q={query}+when:1d&hl=en-US&gl=US&ceid=US:en"

# ------------------------------------------------------------
# "Dato uscito": a ogni giro l'agente controlla queste serie ufficiali e, appena esce un valore
# nuovo, lo pubblica con il precedente e il consensus (se il calendario lo riporta).
#   fonte: fred (serie), bce (chiave), eurostat (dataset + filtri)
#   trasformazione: livello (normale), variazione_annua (dall'indice dei prezzi alla variazione %
#                   sull'anno prima), differenza (variazione sul periodo prima, es. nuovi occupati)
#   avvisa: se_cambia = solo quando il valore cambia (tassi ufficiali, che sono serie giornaliere)
#   calendario: evento del calendario da cui prendere il consensus
# ------------------------------------------------------------
indicatori:
  # Stati Uniti (FRED)
  - nome: "Inflazione USA (CPI, a/a)"
    fonte: fred
    serie: CPIAUCSL
    trasformazione: variazione_annua
    unita: "%"
    soglia_sorpresa: 0.2
    reparti: [Macroeconomia, Obbligazionario]
    calendario: {paese: USD, titoli: ["CPI y/y"]}
    perche: "Guida le attese sui tassi della Fed e quindi i rendimenti dei Treasury"
  - nome: "Inflazione di fondo USA (CPI core, a/a)"
    fonte: fred
    serie: CPILFESL
    trasformazione: variazione_annua
    unita: "%"
    soglia_sorpresa: 0.2
    reparti: [Macroeconomia, Obbligazionario]
    calendario: {paese: USD, titoli: ["Core CPI y/y"]}
  - nome: "Inflazione PCE di fondo USA (a/a)"
    fonte: fred
    serie: PCEPILFE
    trasformazione: variazione_annua
    unita: "%"
    soglia_sorpresa: 0.2
    reparti: [Macroeconomia, Obbligazionario]
    perche: "È la misura di inflazione a cui guarda la Fed"
  - nome: "Nuovi occupati USA (non agricoli)"
    fonte: fred
    serie: PAYEMS
    trasformazione: differenza
    formato: migliaia
    soglia_sorpresa: 75
    reparti: [Macroeconomia]
    calendario: {paese: USD, titoli: ["Non-Farm Employment Change"]}
    perche: "Misura la forza del lavoro negli USA, decisiva per le prossime mosse della Fed"
  - nome: "Disoccupazione USA"
    fonte: fred
    serie: UNRATE
    unita: "%"
    soglia_sorpresa: 0.2
    reparti: [Macroeconomia]
    calendario: {paese: USD, titoli: ["Unemployment Rate"]}
  - nome: "PIL USA (trimestre, annualizzato)"
    fonte: fred
    serie: A191RL1Q225SBEA
    trimestrale: true
    unita: "%"
    soglia_sorpresa: 0.5
    reparti: [Macroeconomia, Azionario]
    calendario: {paese: USD, titoli: ["Advance GDP q/q", "Prelim GDP q/q", "Final GDP q/q"]}
  - nome: "Tasso Fed (limite superiore)"
    fonte: fred
    serie: DFEDTARU
    avvisa: se_cambia
    unita: "%"
    decimali: 2
    soglia_sorpresa: 0.1
    reparti: [Macroeconomia, Obbligazionario, Copertura]
    calendario: {paese: USD, titoli: ["Federal Funds Rate"]}
    perche: "Cambia il rendimento del monetario in dollari e il costo della copertura del cambio"
  # Area euro e Italia (BCE, Eurostat)
  - nome: "Tasso BCE sui depositi"
    fonte: bce
    chiave: "FM/D.U2.EUR.4F.KR.DFR.LEV"
    avvisa: se_cambia
    unita: "%"
    decimali: 2
    soglia_sorpresa: 0.1
    reparti: [Macroeconomia, Obbligazionario, Copertura]
    calendario: {paese: EUR, titoli: ["Deposit Facility Rate"]}
    perche: "Determina il rendimento del monetario in euro e muove tutta la curva dei tassi europea"
  - nome: "Inflazione area euro (HICP, a/a)"
    fonte: eurostat
    dataset: prc_hicp_minr
    filtri: {geo: EA, unit: RCH_A, coicop18: TOTAL}
    unita: "%"
    soglia_sorpresa: 0.2
    reparti: [Macroeconomia, Obbligazionario]
    calendario: {paese: EUR, titoli: ["CPI Flash Estimate y/y", "Final CPI y/y"]}
    perche: "È il riferimento della BCE: guida le attese sui tassi europei"
  - nome: "Inflazione Italia (IPCA, a/a)"
    fonte: eurostat
    dataset: prc_hicp_minr
    filtri: {geo: IT, unit: RCH_A, coicop18: TOTAL}
    unita: "%"
    soglia_sorpresa: 0.3
    reparti: [Macroeconomia, Obbligazionario]
  - nome: "Disoccupazione area euro"
    fonte: eurostat
    dataset: une_rt_m
    filtri: {geo: EA21, s_adj: SA, age: TOTAL, sex: T, unit: PC_ACT}
    unita: "%"
    soglia_sorpresa: 0.2
    reparti: [Macroeconomia]
    calendario: {paese: EUR, titoli: ["Unemployment Rate"]}
  - nome: "Disoccupazione Italia"
    fonte: eurostat
    dataset: une_rt_m
    filtri: {geo: IT, s_adj: SA, age: TOTAL, sex: T, unit: PC_ACT}
    unita: "%"
    soglia_sorpresa: 0.3
    reparti: [Macroeconomia]
    calendario: {paese: EUR, titoli: ["Italian Monthly Unemployment Rate"]}
  - nome: "PIL area euro (t/t)"
    fonte: eurostat
    dataset: namq_10_gdp
    filtri: {geo: EA21, unit: CLV_PCH_PRE, s_adj: SCA, na_item: B1GQ}
    unita: "%"
    soglia_sorpresa: 0.2
    reparti: [Macroeconomia, Azionario]
    calendario: {paese: EUR, titoli: ["Prelim Flash GDP q/q", "Flash GDP q/q", "Revised GDP q/q"]}
  - nome: "PIL Italia (t/t)"
    fonte: eurostat
    dataset: namq_10_gdp
    filtri: {geo: IT, unit: CLV_PCH_PRE, s_adj: SCA, na_item: B1GQ}
    unita: "%"
    soglia_sorpresa: 0.2
    reparti: [Macroeconomia, Obbligazionario]
    calendario: {paese: EUR, titoli: ["Italian Prelim GDP q/q"]}

# Numeri della settimana nel riepilogo domenicale: valore e variazione sulla settimana.
#   tipo: tasso = variazione in punti base (tassi e spread); altrimenti variazione percentuale
mercati:
  - {nome: "S&P 500", fonte: yahoo, simbolo: "^GSPC", decimali: 0}
  - {nome: "STOXX Europe 600", fonte: yahoo, simbolo: "^STOXX", decimali: 1}
  - {nome: "MSCI EM (ETF EEM, $)", fonte: yahoo, simbolo: "EEM", decimali: 2}
  - {nome: "FTSE MIB", fonte: yahoo, simbolo: "FTSEMIB.MI", decimali: 0}
  - {nome: "VIX", fonte: yahoo, simbolo: "^VIX", decimali: 1}
  - {nome: "Treasury 10 anni", fonte: fred, serie: DGS10, tipo: tasso, unita: "%"}
  - {nome: "Treasury 2 anni", fonte: fred, serie: DGS2, tipo: tasso, unita: "%"}
  - {nome: "Curva euro AAA 10 anni", fonte: bce, chiave: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y", tipo: tasso, unita: "%"}
  - {nome: "Breakeven USA 10 anni", fonte: fred, serie: T10YIE, tipo: tasso, unita: "%"}
  - {nome: "Spread IG USA", fonte: fred, serie: BAMLC0A0CM, tipo: tasso, unita: "%"}
  - {nome: "Spread HY USA", fonte: fred, serie: BAMLH0A0HYM2, tipo: tasso, unita: "%"}
  - {nome: "Spread corporate EM", fonte: fred, serie: BAMLEMCBPIOAS, tipo: tasso, unita: "%"}
  - {nome: "EUR/USD", fonte: bce, chiave: "EXR/D.USD.EUR.SP00.A", decimali: 4}
  - {nome: "Petrolio Brent ($)", fonte: fred, serie: DCOILBRENTEU, decimali: 1}
  - {nome: "€STR", fonte: bce, chiave: "EST/B.EU000A2X2A25.WT", tipo: tasso, unita: "%", decimali: 3}
  - {nome: "SOFR", fonte: fred, serie: SOFR, tipo: tasso, unita: "%"}

# Copertura del cambio: il cambio mostrato nel buongiorno e i due tassi il cui differenziale
# stima il costo annuo della copertura USD→EUR (nomi delle voci di "mercati")
copertura: {cambio: "EUR/USD", tasso_usd: SOFR, tasso_eur: "€STR"}

# Reazione dei mercati: per un dato uscito, come si sono mosse queste quotazioni dall'ora di uscita
# (usa = dati FRED, euro = dati BCE ed Eurostat); per le notizie da 9-10, nell'ultima ora.
reazione_mercati:
  usa: [EUR/USD, Treasury 10a, S&P 500 fut.]
  euro: [EUR/USD, Euro Stoxx 50, FTSE MIB]
  notizie: [EUR/USD, Treasury 10a, S&P 500 fut., Euro Stoxx 50, Brent]
  voto_minimo_notizie: 9

# Quotazioni: i valori scritti sotto le notizie (l'IA sceglie quelli toccati da ciascuna: tassi, cambi,
# materie prime, indici) e la reazione dei mercati. Yahoo Finance (simbolo): prezzo del momento, o
# l'ultima chiusura a borsa chiusa; fred e bce: ultimo dato ufficiale giornaliero.
#   tipo: tasso = livello in % e variazione in punti base; altrimenti variazione percentuale
#   decimali: cifre dopo la virgola (altrimenti 2, e 0 sopra 1000); unita: scritta dopo il numero
quotazioni:
  EUR/USD: {simbolo: "EURUSD=X", decimali: 4}
  USD/JPY: {simbolo: "JPY=X"}
  EUR/GBP: {simbolo: "EURGBP=X", decimali: 4}
