# Prova i motori di IA uno per uno con una vera scelta delle notizie: non invia e non salva nulla.
# Si avvia a mano ("Run workflow") e da sola quando qualcuno cambia ia.py, config.yaml o la prova stessa
# (le modifiche fatte dal bot Telegram non la fanno partire). Il risultato è in fondo al registro;
# un motore che non risponde compare anche come avviso giallo nel riepilogo del giro.
name: Prova motori IA

on:
  workflow_dispatch:
    inputs:
      anche:
        description: "Altri modelli da provare, separati da spazi (es. gemini:gemini-2.5-flash-lite openrouter:nome:free github:openai/gpt-4o-mini)"
        type: string
        default: ""
  push:
    paths: [ia.py, config.yaml, strumenti/prova_motori.py, .github/workflows/prova-motori.yml]

permissions:
  contents: read
  models: read      # per GitHub Models

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prova dei motori
        run: python strumenti/prova_motori.py --modelli
        env:
          PYTHONUNBUFFERED: "1"   # il registro si scrive subito: resta anche se il giro viene interrotto
          PROVA_ANCHE: ${{ inputs.anche || 'gemini:gemini-2.5-flash-lite gemini:gemini-3.1-flash-lite gemini:gemini-3.5-flash-lite gemini:gemini-2.5-flash openrouter:nvidia/nemotron-3-ultra-550b-a55b:free openrouter:nvidia/nemotron-3.5-lightning:free openrouter:google/gemma-4-26b-a4b-it:free openrouter:baidu/ernie-5.5-flash-preview:free github:openai/gpt-4o-mini github:openai/gpt-4.1-nano' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
