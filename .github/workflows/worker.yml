# Pubblica il Worker di Cloudflare (cartella cloudflare) quando cambia su main, o a mano con "Run workflow":
# così non serve lanciare "npx wrangler deploy" dal computer.
# Serve una volta il Secret CLOUDFLARE_API_TOKEN: su Cloudflare, My Profile → API Tokens → Create Token →
# modello "Edit Cloudflare Workers". I segreti del Worker (TELEGRAM_TOKEN ecc.) restano quelli già salvati.
name: Worker Cloudflare

on:
  push:
    branches: [main]
    paths: ["cloudflare/**"]
  workflow_dispatch:

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Pubblica il Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Manca il Secret CLOUDFLARE_API_TOKEN (vedi le istruzioni in cima a questo file)"
            exit 1
          fi
          npx --yes wrangler deploy
