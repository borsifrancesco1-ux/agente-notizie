# Manda nella chat privata una notizia di esempio quando cambia il formato dei messaggi,
# senza far girare la selezione delle notizie. Si può avviare anche a mano ("Run workflow").
name: Anteprima messaggio

on:
  push:
    branches: [main]
    paths: [notifiche.py, strumenti/anteprima.py]
  workflow_dispatch:

jobs:
  anteprima:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python strumenti/anteprima.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
